<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="theme-color" content="#f8f8f8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PostqVPN" />
    <script>
      ;(() => {
        const theme = localStorage.getItem('theme')
        const resolvedTheme = theme === 'light' || theme === 'dark' || theme === 'auto' ? theme : 'auto'
        const isDark = resolvedTheme === 'dark' || (resolvedTheme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', isDark)
        document.querySelector('meta[name="theme-color"]').content = isDark ? '#1a1a1c' : '#f8f8f8'
      })()
    </script>
    <title>PostqVPN</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
